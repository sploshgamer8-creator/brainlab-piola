name: Local Brain Lab CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Numerical Audit & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Mathematical Audit Test Suite (nanoGPT, PER, SafeTensors, KD)
        run: npm run test

      - name: Production Build Verification
        run: npm run build
